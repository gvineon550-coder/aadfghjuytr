name: Update Wink IPTV playlist

on:
  schedule:
    # Сдвинули на 17 минут, чтобы не попадать в пик нагрузки GitHub
    - cron: '17 3 * * *'  # 03:17 UTC = 06:17 МСК
  workflow_dispatch:      # Ручной запуск

permissions:
  contents: write

concurrency:
  group: update-wink-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download sources
        run: |
          set -e
          echo "→ Скачиваем ru.m3u..."
          curl -fsSL -o source_ru.m3u "https://raw.githubusercontent.com/iptv-org/iptv/master/streams/ru.m3u"
          echo "→ Скачиваем channels.json..."
          curl -fsSL -o channels.json "https://iptv-org.github.io/api/channels.json"
          echo "→ Скачиваем logos.json..."
          curl -fsSL -o logos.json "https://iptv-org.github.io/api/logos.json"
          echo "✅ Все источники скачаны"
          ls -lh source_ru.m3u channels.json logos.json

      - name: Enrich playlist
        run: python3 scripts/enrich.py

      - name: Verify output
        run: |
          if [ ! -f wink_ru.m3u ]; then
            echo "❌ ФАЙЛ wink_ru.m3u НЕ СОЗДАН!"
            exit 1
          fi
          echo "✅ wink_ru.m3u создан, размер:"
          ls -lh wink_ru.m3u
          echo "────── Первые 10 строк: ──────"
          head -10 wink_ru.m3u
          echo "────── Статистика: ──────"
          # Флаг || true нужен, чтобы шаг не падал с ошибкой, если совпадений 0
          echo "Каналов: $(grep -c '^#EXTINF' wink_ru.m3u || true)"
          echo "С UA Wink: $(grep -c 'http-user-agent=WINK' wink_ru.m3u || true)"
          echo "С логотипами: $(grep -c 'tvg-logo=' wink_ru.m3u || true)"

      - name: Cleanup temp files
        run: rm -f source_ru.m3u channels.json logos.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wink_ru.m3u
          
          if git diff --cached --quiet; then
            echo "ℹ️ Нет изменений — плейлист уже актуален."
            exit 0
          fi
          
          git commit -m "chore: auto-update Wink playlist ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          
          # Делаем rebase, чтобы избежать конфликтов, если в репо что-то менялось
          git pull --rebase origin ${GITHUB_REF_NAME} || true
          
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "✅ Изменения успешно запушены"
