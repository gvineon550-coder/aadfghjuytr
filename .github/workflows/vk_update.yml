name: VK Live Auto-Update

on:
  schedule:
    - cron: '0 */6 * * *'   # Каждые 6 часов
  workflow_dispatch:

jobs:
  update-vk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run VK Playlist Builder
        run: python vk_updater.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'VK Auto-Bot'
          git config --global user.email 'bot@github.com'
          git add vk_live.m3u vk_top.m3u 
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update VK Live playlist [skip ci]"
          git push
