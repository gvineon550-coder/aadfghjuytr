name: VK Live Auto-Update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-vk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests

      - name: Run VK Updater
        run: python vk_updater.py
        env:
          FORCE_COLOR: '1'
          PYTHONUNBUFFERED: '1'

      - name: Commit and Push changes
        run: |
          git config --global user.name 'VK Auto-Bot'
          git config --global user.email 'bot@github.com'
          # Добавляем и плейлист, и файл кэша
          git add vk_live.m3u rutube_cache.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update VK & Rutube links [skip ci]"
          git push
